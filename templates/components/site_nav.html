{# Cabecera compartida de la web pública (home y /juegos). Espera nav_count (nº de juegos activos). #}
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 72px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  .nav { position: sticky; top: 0; z-index: 100; background: #FBF7F1; border-bottom: 1px solid #E4DACE; }
  .nav .wrap { max-width: 1160px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  @media (min-width: 900px) { .nav .wrap { padding: 0 40px; } }
  .nav img { width: 112px; height: auto; display: block; }
  .nav-links { display: none; gap: 28px; font-size: 14px; font-weight: 500; }
  .nav-links a { text-decoration: none; color: #6B6059; }
  .nav-links a:hover, .nav-links a[aria-current="page"] { color: #1A1A1A; }
  @media (min-width: 900px) { .nav-links { display: flex; } }
  .nav-cta { display: inline-flex; align-items: center; border: none; cursor: pointer; text-decoration: none; font-weight: 600; border-radius: 8px; padding: 10px 16px; font-size: 14px; line-height: 1; background: #A8410E; color: #fff; font-family: inherit; white-space: nowrap; }
  .nav-cta:hover { background: #8F3509; }
</style>
<nav class="nav">
  <div class="wrap">
    <a href="/"><img src="/static/logo.svg" alt="Nookplay"></a>
    <div class="nav-links">
      <a href="/#eventos">Eventos</a>
      <a href="/#como">Cómo funciona</a>
      <a href="/#locales">Locales</a>
      <a href="/juegos" {% if nav_current == 'juegos' %}aria-current="page"{% endif %}>Los {{ nav_count }} juegos</a>
      <a href="/demo">Demo</a>
    </div>
    <button class="nav-cta" onclick="openContactModal()">Cuéntanos tu evento</button>
  </div>
</nav>
