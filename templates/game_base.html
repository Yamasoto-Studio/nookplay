{% extends "base.html" %}
{% block content %}

<style>
  :root {
    --bar-primary: {{ bar.color_primary }};
    --bar-primary-text: {{ bar.color_primary_text }};
    --bar-bg: {{ bar.color_bg }};
    --bar-bg-card: #FFFFFF;
    --bar-bg-subtle: {{ bar.color_bg_subtle }};
    --bar-accent-dark: {{ bar.color_accent_dark }};
  }
</style>

<link rel="stylesheet" href="/static/css/games.css?v=4">
<script>
(function(){
  // Identificador anónimo de dispositivo (un valor aleatorio en el navegador, SIN datos
  // personales). Sirve para contar alcance real: personas/mesas distintas que juegan.
  function nookDeviceId(){
    try {
      var k='nook_did', v=localStorage.getItem(k);
      if(!v){
        v = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
            : 'd-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);
        localStorage.setItem(k, v);
      }
      return v;
    } catch(e){ return ''; }  // si el navegador bloquea el almacenamiento, no rompemos nada
  }
  window.nookDeviceId = nookDeviceId;

  // Nombre de jugador OPCIONAL, guardado solo en este navegador (sin cuenta ni email).
  // Sirve para la tabla del día del espacio. Se cambia o borra tocándolo.
  function nookNombre(){ try { return (localStorage.getItem('nook_nombre') || '').slice(0, 16); } catch(e){ return ''; } }
  function nookSetNombre(n){ try { n = (n || '').trim().slice(0, 16); if (n) localStorage.setItem('nook_nombre', n); else localStorage.removeItem('nook_nombre'); } catch(e){} return nookNombre(); }
  window.nookNombre = nookNombre; window.nookSetNombre = nookSetNombre;

  // Inyecta device_id en TODAS las llamadas /api/ con body JSON, sin tocar cada juego.
  // Sirve para (a) estadísticas de alcance y (b) el pool de variantes de eventos,
  // que necesita saber qué variantes ha visto cada dispositivo.
  // Además registra qué juegos se han jugado hoy (para el ✓ del menú).
  var _fetch = window.fetch;
  window.fetch = function(url, opts){
    try {
      if (typeof url === 'string' && opts && opts.body && url.indexOf('/api/') !== -1) {
        var b = JSON.parse(opts.body);
        if (b && typeof b === 'object' && !b.device_id) {
          b.device_id = nookDeviceId();
          if (url.indexOf('/api/play') !== -1 && !b.player_name) { b.player_name = nookNombre(); }
          opts = Object.assign({}, opts, { body: JSON.stringify(b) });
        }
        // Marcar como jugado hoy: SOLO en los endpoints de registro de partida
        if (url.indexOf('/api/play') !== -1 || url.indexOf('/api/pensamiento-responder') !== -1) {
        try {
          var gt = (b && b.game_type) || (url.indexOf('/api/pensamiento-responder') !== -1 ? 'pensamiento' : '');
          if (gt) {
            var hoy = new Date().toISOString().slice(0,10);
            var pk = 'nook_played_{{ bar.slug }}_' + hoy;
            var arr = JSON.parse(localStorage.getItem(pk) || '[]');
            if (arr.indexOf(gt) === -1) { arr.push(gt); localStorage.setItem(pk, JSON.stringify(arr)); }
            // Limpieza: días anteriores DE ESTE ESPACIO + claves del formato viejo sin slug
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var kk = localStorage.key(i);
              if (!kk) continue;
              var deEsteEspacio = kk.indexOf('nook_played_{{ bar.slug }}_') === 0 && kk !== pk;
              var formatoViejo = /^nook_played_\d{4}-\d{2}-\d{2}$/.test(kk);
              if (deEsteEspacio || formatoViejo) localStorage.removeItem(kk);
            }
          }
        } catch(e){}
        }
      }
    } catch(e){}
    // Llamadas /api/: corte a los NOOK_FETCH_TIMEOUT ms (red de feria, worker ocupado)
    // y errores del servidor convertidos en un Error con mensaje amable, para que
    // ningún juego se quede con el spinner eterno ni pinte un JSON de error.
    var esApi = (typeof url === 'string' && url.indexOf('/api/') !== -1);
    if (!esApi) return _fetch.call(this, url, opts);
    var ctrl = (window.AbortController) ? new AbortController() : null;
    var timer = null;
    if (ctrl && !(opts && opts.signal)) {
      opts = Object.assign({}, opts || {}, { signal: ctrl.signal });
      timer = setTimeout(function(){ try { ctrl.abort(); } catch(e){} }, window.NOOK_FETCH_TIMEOUT || 40000);
    }
    return _fetch.call(this, url, opts).then(function(res){
      if (timer) clearTimeout(timer);
      if (res.ok || res.status === 403 || res.status === 404) return res;
      return res.clone().json().catch(function(){ return {}; }).then(function(j){
        var err = new Error((j && j.error) || window.NOOK_MSG_ERROR);
        err.nookAmable = true; err.status = res.status;
        throw err;
      });
    }, function(e){
      if (timer) clearTimeout(timer);
      var err = new Error(e && e.name === 'AbortError' ? window.NOOK_MSG_LENTO : window.NOOK_MSG_RED);
      err.nookAmable = true; err.causa = e;
      throw err;
    });
  };

  window.NOOK_MSG_ERROR = 'Este juego está descansando un momento. Prueba otro del menú o vuelve en un minuto.';
  window.NOOK_MSG_LENTO = 'Está tardando más de lo normal. Puedes esperar un poco o probar otro juego.';
  window.NOOK_MSG_RED   = 'No hay conexión ahora mismo. Comprueba la red y vuelve a intentarlo.';

  // Pantalla de fallo única para todos los juegos (se muestra si un error llega
  // sin que el juego lo capture). Siempre deja una salida: volver al menú.
  function nookMostrarFallo(msg){
    try {
      if (document.getElementById('nook-fallo')) return;
      var d = document.createElement('div');
      d.id = 'nook-fallo';
      d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(247,242,235,.96);display:flex;align-items:center;justify-content:center;padding:24px;';
      d.innerHTML = '<div style="max-width:360px;width:100%;background:#fff;border-radius:18px;padding:26px 22px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);font-family:inherit">'
        + '<div style="font-size:34px;line-height:1;margin-bottom:10px">☕</div>'
        + '<p style="margin:0 0 18px;font-size:15px;line-height:1.45;color:#1A1A1A"></p>'
        + '<a href="/{{ bar.slug }}?code={{ code }}" style="display:block;background:var(--bar-primary,#C4622D);color:var(--bar-primary-text,#fff);text-decoration:none;border-radius:12px;padding:13px;font-weight:600;margin-bottom:8px">Volver al menú</a>'
        + '<button type="button" style="display:block;width:100%;background:none;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:14px;color:#555">Reintentar</button>'
        + '</div>';
      d.querySelector('p').textContent = msg || window.NOOK_MSG_ERROR;
      d.querySelector('button').onclick = function(){ location.reload(); };
      document.body.appendChild(d);
      // Que no quede una rueda girando debajo del aviso
      document.querySelectorAll('.loading-spinner').forEach(function(sp){ sp.style.display = 'none'; });
    } catch(e){}
  }
  window.nookMostrarFallo = nookMostrarFallo;
  window.addEventListener('unhandledrejection', function(ev){
    var r = ev && ev.reason;
    if (r && r.nookAmable) { ev.preventDefault(); nookMostrarFallo(r.message); }
  });
})();
</script>
<script src="/static/js/stats.js"></script>
<script>window.NOOK_ES_EVENTO = {{ 'true' if (bar.space_kind or 'local') == 'evento' else 'false' }};</script>
<script src="/static/js/share.js?v=5"></script>
<script>
const GAME_PRODUCTS = {{ products_json|default('[]') }};
function showResultPromo() {
  if (!GAME_PRODUCTS || GAME_PRODUCTS.length === 0) return;
  const el = document.getElementById('result-promo');
  if (!el) return;
  const p = GAME_PRODUCTS[Math.floor(Math.random() * GAME_PRODUCTS.length)];
  el.innerHTML = `
    <div class="result-promo-wrap">
      <div class="promo-label">✨ Mientras estás aquí</div>
      <div class="promo-item">
        ${p.image_path ? `<img src="${p.image_path}" alt="${p.title}" class="promo-img" onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}">` : ''}
        <div class="promo-info">
          <div class="promo-title">${p.title}</div>
          ${p.description ? `<div class="promo-desc">${p.description}</div>` : ''}
          ${p.price ? `<div class="promo-price">${p.price}</div>` : ''}
        </div>
      </div>
    </div>`;
  el.style.display = 'block';
}

// La promo del espacio (Oferta, Freep, el café del día…) aparece en la pantalla
// de resultado de TODOS los juegos sin que cada plantilla tenga que llamarla:
// cuando #s-result o #s-final se activa, se crea el hueco si no existe (justo
// antes del botón Compartir) y se pinta una vez.
(function () {
  if (!GAME_PRODUCTS || GAME_PRODUCTS.length === 0) return;
  let hecho = false;
  function intentar() {
    if (hecho) return;
    const pantalla = document.querySelector('#s-result.active, #s-final.active');
    if (!pantalla) return;
    let hueco = pantalla.querySelector('#result-promo') || document.getElementById('result-promo');
    if (!hueco) {
      hueco = document.createElement('div');
      hueco.id = 'result-promo';
      hueco.style.display = 'none';
      const ancla = pantalla.querySelector('.btn-share') || pantalla.querySelector('.btn-menu') || pantalla.querySelector('.tomorrow');
      if (ancla && ancla.parentNode) ancla.parentNode.insertBefore(hueco, ancla); else pantalla.appendChild(hueco);
    }
    hecho = true;
    if (!hueco.innerHTML.trim()) showResultPromo();
  }
  const arrancar = () => {
    intentar();
    const mo = new MutationObserver(intentar);
    document.querySelectorAll('.screen').forEach(s => mo.observe(s, { attributes: true, attributeFilter: ['class'] }));
  };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', arrancar); else arrancar();
})();
</script>

<div class="nook">
  <div class="bar-hero bar-hero--game">
    <img class="bar-hero-logo"
      src="/media/{{ bar.slug }}/logo_header.png" data-fb="/static/clientes/{{ bar.slug }}/logo_header.png"
      alt="{{ bar.name }}"
      onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.dataset.fb='';}else{this.style.display='none';}">
    <p class="bar-hero-meta" id="bar-hero-meta"></p>
    <a href="/{{ bar.slug }}?code={{ code }}" class="bar-hero-by">by <img src="/static/logo.svg" alt="nookplay"></a>
  </div>
  <script>
  (function () {
    const INFO = {{ {'evento': (bar.space_kind or 'local') == 'evento', 'start': bar.event_start or '', 'end': bar.event_end or '', 'lugar': (bar.address or bar.city or ''), 'subtitulo': (bar.hero_subtitle or '')}|tojson }};
    const meta = document.getElementById('bar-hero-meta');
    if (!meta) return;
    if (INFO.subtitulo) { meta.textContent = INFO.subtitulo; return; }
    if (!INFO.evento) return;
    const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    const parse = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; };
    const d1 = parse(INFO.start), d2 = parse(INFO.end);
    const partes = [];
    if (d1 && d2) {
      const mismoMes = d1.getMonth() === d2.getMonth();
      partes.push(d1.getTime() === d2.getTime() ? `${d1.getDate()} ${MESES[d1.getMonth()]}`
        : mismoMes ? `${d1.getDate()}–${d2.getDate()} ${MESES[d2.getMonth()]}`
        : `${d1.getDate()} ${MESES[d1.getMonth()]} – ${d2.getDate()} ${MESES[d2.getMonth()]}`);
    }
    if (INFO.lugar) partes.push(INFO.lugar);
    meta.textContent = partes.join('  ·  ');
  })();
  </script>
  <div class="nook-content">
    <div class="nook-card">
      {% block game_content %}{% endblock %}
    </div>
  </div>
  <template id="tabla-dia-tpl">
<div class="tabla-dia" id="tabla-dia" style="display:none;">
    <div class="tabla-dia-head"><span>Hoy aquí</span><span class="tabla-dia-et" id="tabla-dia-et"></span></div>
    <ol class="tabla-dia-list" id="tabla-dia-list"></ol>
    <div class="tabla-dia-mio" id="tabla-dia-mio" style="display:none;"></div>
    <div class="tabla-dia-nombre" id="tabla-dia-nombre">
      <span id="tabla-dia-nombre-txt"></span>
      <button type="button" onclick="nookPedirNombre()" id="tabla-dia-nombre-btn">Pon tu nombre para salir</button>
    </div>
  </div>
  </template>
<script>
(function(){
  var GT = (document.body.getAttribute('data-game') || (location.pathname.split('/').filter(Boolean).pop() || '')).split('?')[0];
  var SLUG = location.pathname.split('/').filter(Boolean)[0] || '';
  function pintarNombre(){
    var n = window.nookNombre ? nookNombre() : '';
    var t = document.getElementById('tabla-dia-nombre-txt'), b = document.getElementById('tabla-dia-nombre-btn');
    if (!t || !b) return;
    if (n) { t.textContent = 'Juegas como ' + n + ' · '; b.textContent = 'cambiar'; }
    else { t.textContent = ''; b.textContent = 'Pon tu nombre para salir en la tabla'; }
  }
  window.nookPedirNombre = function(){
    var actual = window.nookNombre ? nookNombre() : '';
    var n = prompt('Tu nombre o apodo para la tabla de hoy (solo se guarda en este móvil):', actual);
    if (n === null) return;
    nookSetNombre(n); pintarNombre();
    // Reenvía la última partida con el nombre para que entre en la tabla
    if (window.__nookUltimaPlay) {
      try { fetch('/api/play', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(window.__nookUltimaPlay) }).then(function(){ window.nookCargarTabla && nookCargarTabla(); }); } catch(e){}
    } else { window.nookCargarTabla && nookCargarTabla(); }
  };
  window.nookCargarTabla = function(){
    if (!GT || !SLUG) return;
    var did = window.nookDeviceId ? nookDeviceId() : '';
    fetch('/api/tabla/' + SLUG + '/' + GT + '?device_id=' + encodeURIComponent(did)).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      if (!d || !d.etiqueta) return;
      var box = document.getElementById('tabla-dia');
      if (!box) {
        // Al final de la pantalla de resultado: después de «Volver al menú» (y antes del
        // mensaje de mañana si lo hay). Si no hay botón de menú, antes del de compartir.
        var scr = document.querySelector('.screen.active') || document;
        var ancla = scr.querySelector('.tomorrow');
        var menu = (function(){ var ms = scr.querySelectorAll('.btn-menu'); return ms.length ? ms[ms.length - 1] : null; })();
        var tpl = document.getElementById('tabla-dia-tpl'); if (!tpl) return;
        if (ancla) ancla.insertAdjacentHTML('beforebegin', tpl.innerHTML);
        else if (menu) menu.insertAdjacentHTML('afterend', tpl.innerHTML);
        else { var share = scr.querySelector('.btn-share'); if (!share) return; share.insertAdjacentHTML('beforebegin', tpl.innerHTML); }
        box = document.getElementById('tabla-dia');
      }
      document.getElementById('tabla-dia-et').textContent = d.etiqueta;
      var ol = document.getElementById('tabla-dia-list');
      ol.innerHTML = (d.filas || []).map(function(f){
        return '<li' + (f.yo ? ' class="yo"' : '') + '><span class="n">' + f.nombre.replace(/</g,'&lt;') + (f.yo ? ' (tú)' : '') + '</span><span class="v">' + f.valor + '</span></li>';
      }).join('') || '<li class="vacio">Sé el primero de hoy.</li>';
      var mio = document.getElementById('tabla-dia-mio');
      if (d.mio) { mio.textContent = 'Tu resultado: ' + d.mio + (nookNombre() ? ' · fuera del top 5 por ahora' : ''); mio.style.display = 'block'; } else { mio.style.display = 'none'; }
      pintarNombre();
      box.style.display = 'block';
    }).catch(function(){});
  };
  // Guardar la última partida enviada para poder reenviarla con nombre
  var _f = window.fetch;
  window.fetch = function(url, opts){
    try { if (typeof url === 'string' && url.indexOf('/api/play') !== -1 && opts && opts.body) { var b = JSON.parse(opts.body); if (b && b.choice !== -2) window.__nookUltimaPlay = b; } } catch(e){}
    var p = _f.apply(this, arguments);
    try { if (typeof url === 'string' && url.indexOf('/api/play') !== -1) { p.then(function(){ setTimeout(function(){ window.nookCargarTabla && nookCargarTabla(); }, 300); }); } } catch(e){}
    return p;
  };
})();
</script>
  <div class="nook-footer">
    <a href="/" class="nook-footer-brand"><img src="/static/logo.svg" alt="Nookplay"></a>
    <span class="nook-footer-by">{% set credits_short = true %}{% include 'components/credits.html' %}</span>
  </div>
</div>

{% endblock %}
